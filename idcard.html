<!DOCTYPE html>

<html>
<head>
    <title>My Profile Card</title>

```
<style>
  
    .card {
        width: 400px;
        padding: 20px;

        background-color: yellowgreen;
        color: white;

        border: 2px solid red;
        border-radius: 25px;
        box-shadow: 0 0 15px blue;
    }

    .institute {
        text-align: center;
        color: rgb(35, 32, 32);
        font-size: 25px;
        border-bottom: 2px solid black;
        padding-bottom: 15px;
        margin-top: 0;
    }

    .profile {
        display: flex;
        align-items: center;
        gap: 25px;
    }

    .profile img {
        width: 150px;
        height: 200px;
        object-fit: cover;
        border: 2px solid rgb(34, 26, 144);
        border-radius: 10px;
    }

    .details h2 {
        font-size: 22px;
        margin-bottom: 20px;
    }

    .details p {
        font-size: 15px;
        margin: 15px 0;
    }
</style>
```

</head>

<body>

```
<div class="card">

    <h1 class="institute">YOUR INSTITUTE NAME</h1>

    <div class="profile">

             alt="Manisha">

        <div class="details">

    </div>

</div>
```

</body>
</html>
