<!DOCTYPE html>

<head>
  
    <title>My Profile Card</title>

    <style>
        body {
            background-color: #8b8ba3;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
        }

        .card {
            width: 350px;
            padding: 20px;
            text-align: center;

            background-color: #ce6728;
            color: rgb(104, 92, 92);

            border: 2px solid #b9b9d0;
            border-radius: 25px;
            box-shadow: 0 0 15px #55556b;
        }

        .profile-icon {
            background-color: #67055c;
            color: #555;
            padding: 25px;
            border-bottom: 12px;
            font-size: 40px;
        }

        h2 {
            font-size: 25px;
        }

        h3 {
            font-size: 18px;
            color: #eeeeee;
            font-weight: normal;
        }

        hr {
            border: 2px solid #9999aa;
            margin: 25px 0;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
        }

        .btn {
            display: block;
            background-color: #0d6f90;
            color: white;

            padding: 15px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #40aaaa;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="profile-icon">
         <img src="WhatsApp Image 2026-08-04 at 2.37.26 PM.jpeg" alt="Manisha" 
            style="width: 200px; height: 260px; border: 5px solid rgb(34, 26, 144);">
        </div>
        

        <h2 color="yellow">Manisha Hajapure</h2>

        <h3 color="red">Data Science Student</h3>

        <hr>

        <p>
            I am learning HTML and CSS to
            build beautiful websites.
        </p>

        <a href="mailto:yourmail@gmail.com" class="btn">
            Contact Me
        </a>

    </div>

</body>
</html>
