<html>
    <head>
        <style>
            .container{
                border: 2px solid black;
                height: 250px;
                width: 700px;
                display: flex;
                flex-direction: row;
                justify-content: space-around;
            }
            .box{
                border: 2px solid red;
                display: inline-block;
                width: 80px;
                height: 80px;
                text-align: center;
            }
            .bottom{
               margin-top: auto; 
            }
            .top{
                margin-bottom: auto;
            }
        </style>
    </head>
    <body>
        <div class="container">
        <div class="box bottom">ONE</div>
        <div class="box top">two</div>
        <div class="box bottom">three</div>
        <div class="box top">four</div>
        <div class="box bottom">five</div> 
        <div class="box top">six</div>
        <div class="box bottom">seven</div>
        </div>
    </body>
</html>
