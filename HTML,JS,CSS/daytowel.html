<html>
    <head>
        <link rel="stylesheet" href="demo.css">

          button {

    }
</style>
        <body>
            <h1>hello <span id="role">___</span>!!</h1>
            <label for="name">Enter your Name:</label>
            <input type="text" id="name"><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email"><br><br>
            <label>Address:</label>
            <input type="address" id="address"><br><br>
            
            <button onclick="demo()">Submit</button>
            <h3>Name: <span id="displayName">---</span></h3>
            <h3>Email: <span id="displayEmail">---</span></h3> 
            <h3>Address: <span id="displayAddress">---</span></h3>
            <script> 
            function demo() {
                let name = document.getE---lementById("name").value;
                let email = document.getElementById("email").value; 
                let address = document.getElementById("address").value; 
                if (name === "" || email === "" || address === "") { 
                    alert("Please fill all the fields!"); 
                    return;
               }
               document.getElementById("role").innerText = name; 
               document.getElementById("displayName").innerText = name; 
               document.getElementById("displayEmail").innerText = email;
              document.getElementById("displayAddress").innerText = address;
               alert("Form submitted successfully!"); 
            }
               
            </script>
        </body>
