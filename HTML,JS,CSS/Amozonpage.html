    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f2f5;
            padding: 20px 10px;
        }

        h2 {
            text-align: center;
            font-size: 28px;
            color: #172033;
            margin-bottom: 28px;
        }

        /* Products Container */
        .products-container {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 10px;
        }

        /* Product Card */
        .product {
            background-color: white;
            padding: 10px 5px;
            text-align: center;
            min-width: 0;
        }

        /* Product Image */
        .product img {
            width: 100%;
            height: 105px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        /* Product Name */
        .product h4 {
            font-size: 11px;
            font-weight: normal;
            margin-bottom: 8px;
        }

        /* Product Price */
        .product p {
            font-size: 12px;
            font-weight: bold;
        }

        /* Tablet */
        @media (max-width: 900px) {
            .products-container {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            .products-container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

    </style>
</head>
